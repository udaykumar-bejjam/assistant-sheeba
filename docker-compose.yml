services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sheeba
      POSTGRES_PASSWORD: sheeba
      POSTGRES_DB: sheeba
    ports:
      - "5432:5432"
    volumes:
      - sheeba_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheeba"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://sheeba:sheeba@postgres:5432/sheeba
      REDIS_URL: redis://redis:6379/0
      AI_PROVIDER: fake
      JSON_LOGS: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  sheeba_pg:
