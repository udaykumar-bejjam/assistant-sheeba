repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: dependency-direction
        name: domain dependency direction
        entry: python scripts/check_dependency_direction.py
        language: system
        pass_filenames: false
