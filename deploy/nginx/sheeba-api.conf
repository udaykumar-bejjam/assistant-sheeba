# Sheeba API reverse proxy — add alongside existing nginx sites.
# Placeholders replaced by remote-setup.sh:
#   __SERVER_NAME__   e.g. api.example.com
#   __UPSTREAM_PORT__ e.g. 8000

upstream sheeba_api_upstream {
    server 127.0.0.1:__UPSTREAM_PORT__;
    keepalive 16;
}

server {
    listen 80;
    server_name __SERVER_NAME__;

    client_max_body_size 20m;

    location /health {
        proxy_pass http://sheeba_api_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://sheeba_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # WebSocket voice path (when enabled)
    location /ws/ {
        proxy_pass http://sheeba_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
